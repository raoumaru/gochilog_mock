<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ゴチログ — Design Mockup v2.0</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500;600&family=Cormorant:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0C0502; }
    .cg   { font-family: 'Cormorant Garamond', Georgia, serif; }
    .cor  { font-family: 'Cormorant', Georgia, serif; }
    .noto { font-family: 'Noto Sans JP', sans-serif; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .s0 { animation: fadeUp .5s .00s both; }
    .s1 { animation: fadeUp .5s .07s both; }
    .s2 { animation: fadeUp .5s .14s both; }
    .s3 { animation: fadeUp .5s .21s both; }
    .s4 { animation: fadeUp .5s .28s both; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(18px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .screen-enter { animation: slideIn .35s cubic-bezier(.22,.68,0,1.2) both; }

    .pressable { transition: transform .15s ease, opacity .15s ease; cursor: pointer; }
    .pressable:active { transform: scale(.97); opacity: .85; }

    ::-webkit-scrollbar { width: 0; height: 0; }

    .noise-overlay { position: relative; }
    .noise-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const T = {
  ivory:      "#FAF7F2",
  ivoryDark:  "#EDE5D8",
  cream:      "#FDF9F4",
  parchment:  "#F5EFE4",
  terra:      "#B8622E",
  terraLight: "#D4845A",
  terraPale:  "#F2E4D8",
  terraDark:  "#8C4820",
  brown:      "#2E1A0C",
  brownMid:   "#5C3318",
  brownLight: "#8C5230",
  sand:       "#C8A882",
  sandLight:  "#E4D0B8",
  charcoal:   "#241408",
  gray:       "#8C7260",
  grayLight:  "#BCA898",
  white:      "#FFFFFF",
  star:       "#C8880C",
  sage:       "#6E8C6E",
  sagePale:   "#E8EFE8",
  line:       "#E0D4C4",

const Icon = {
  home: (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
      <path d="M9 21V12h6v9"/>
    </svg>
  ),
  map: (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <polygon points="3,6 9,3 15,6 21,3 21,18 15,21 9,18 3,21"/>
      <line x1="9" y1="3" x2="9" y2="18"/>
      <line x1="15" y1="6" x2="15" y2="21"/>
    </svg>
  ),
  search: (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="11" cy="11" r="7"/>
      <line x1="16.5" y1="16.5" x2="22" y2="22"/>
    </svg>
  ),
  chart: (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"/>
      <line x1="12" y1="20" x2="12" y2="4"/>
      <line x1="6"  y1="20" x2="6"  y2="14"/>
      <line x1="2"  y1="20" x2="22" y2="20"/>
    </svg>
  ),
  settings: (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  ),
  plus: (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  ),
  back: (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  ),
  pin: (
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </svg>
  ),
  camera: (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  ),
  calendar: (
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
  ),
  tag: (
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
      <line x1="7" y1="7" x2="7.01" y2="7"/>
    </svg>
  ),
  fork: (
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <line x1="12" y1="2" x2="12" y2="22"/>
      <path d="M5 2v6a3 3 0 006 0V2"/>
      <path d="M19 2v4a2 2 0 01-2 2h-1v14"/>
    </svg>
  ),
  list: (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round">
      <line x1="8" y1="6" x2="21" y2="6"/>
      <line x1="8" y1="12" x2="21" y2="12"/>
      <line x1="8" y1="18" x2="21" y2="18"/>
      <line x1="3" y1="6" x2="3.01" y2="6"/>
      <line x1="3" y1="12" x2="3.01" y2="12"/>
      <line x1="3" y1="18" x2="3.01" y2="18"/>
    </svg>
  ),
  close: (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  ),
};

const Stars = ({ n = 4, size = 12, interactive = false, onChange }) => (
  <div style={{ display: "flex", gap: 2 }}>
    {[1,2,3,4,5].map(i => (
      <svg key={i} width={size} height={size} viewBox="0 0 24 24"
        onClick={() => interactive && onChange && onChange(i)}
        style={{ cursor: interactive ? "pointer" : "default", flexShrink: 0 }}
      >
        <polygon
          points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"
          fill={i <= n ? T.star : "none"}
          stroke={i <= n ? T.star : T.grayLight}
          strokeWidth="1.5"
          strokeLinejoin="round"
        />
      </svg>
    ))}
  </div>
);

const Chip = ({ label, active = true }) => (
  <span className="noto" style={{
    display: "inline-flex", alignItems: "center", gap: 3,
    padding: "2px 8px", borderRadius: 20, fontSize: 9, fontWeight: 500,
    background: active ? T.sagePale : T.ivoryDark,
    color: active ? T.sage : T.gray,
    border: `1px solid ${active ? T.sage + "50" : T.line}`,
    letterSpacing: "0.02em",
    whiteSpace: "nowrap",
    flexShrink: 0,
  }}>
    <span style={{ color: active ? T.sage : T.grayLight }}>{Icon.tag}</span>
    {label}
  </span>
);

const PhotoPlaceholder = ({ w = "100%", h = 80, br = 10, idx = 0 }) => {
  const stops = [
    [T.terraPale, T.sandLight],
    [T.sandLight, T.ivoryDark],
    [T.terraPale, T.parchment],
    [T.parchment, T.sandLight],
  ];
  const [from, to] = stops[idx % stops.length];
  return (
    <div style={{
      width: w, height: h, borderRadius: br, flexShrink: 0,
      background: `linear-gradient(135deg, ${from} 0%, ${to} 100%)`,
      border: `1px solid ${T.line}`,
      display: "flex", alignItems: "center", justifyContent: "center",
      position: "relative", overflow: "hidden",
    }}>
      <svg style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0.12 }}>
        <defs>
          <pattern id={`pp${idx}`} width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="8" stroke={T.brownMid} strokeWidth="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill={`url(#pp${idx})`}/>
      </svg>
      <div style={{ color: T.brownLight, opacity: 0.4 }}>{Icon.fork}</div>
    </div>
  );
};

const Avatar = ({ size = 34, letter = "Y" }) => (
  <div style={{
    width: size, height: size, borderRadius: "50%",
    background: `linear-gradient(135deg, ${T.terra} 0%, ${T.terraDark} 100%)`,
    display: "flex", alignItems: "center", justifyContent: "center",
    color: T.white, flexShrink: 0,
    boxShadow: `0 2px 8px ${T.terra}40`,
  }}>
    <span className="cg" style={{ fontSize: size * 0.42, fontWeight: 500, lineHeight: 1 }}>{letter}</span>
  </div>
);

const Divider = ({ mx = 0, color = T.line }) => (
  <div style={{ height: 1, background: color, margin: `0 ${mx}px` }} />
);

const Label = ({ children, sub }) => (
  <div style={{ display: "flex", alignItems: "baseline", gap: 5, marginBottom: 7 }}>
    <span className="noto" style={{ fontSize: 10, fontWeight: 600, color: T.brownMid, letterSpacing: "0.06em" }}>{children}</span>
    {sub && <span className="noto" style={{ fontSize: 8, color: T.gray, fontWeight: 400 }}>{sub}</span>}
  </div>
);

const Phone = ({ children }) => (
  <div style={{
    width: 295, height: 620,
    borderRadius: 48,
    background: `linear-gradient(160deg, #1C0C04 0%, #0E0604 100%)`,
    padding: 9,
    boxShadow: `0 40px 100px #00000090, 0 0 0 1px #ffffff0A, inset 0 1px 0 #ffffff12, inset 0 -1px 0 #00000040`,
    position: "relative",
  }}>
    <div style={{ position: "absolute", right: -3, top: 100, width: 3, height: 40, background: "#0E0604", borderRadius: "0 2px 2px 0" }} />
    <div style={{ position: "absolute", left: -3, top: 80,  width: 3, height: 30, background: "#0E0604", borderRadius: "2px 0 0 2px" }} />
    <div style={{ position: "absolute", left: -3, top: 120, width: 3, height: 50, background: "#0E0604", borderRadius: "2px 0 0 2px" }} />
    <div style={{ position: "absolute", left: -3, top: 178, width: 3, height: 50, background: "#0E0604", borderRadius: "2px 0 0 2px" }} />
    <div style={{
      width: "100%", height: "100%", borderRadius: 40,
      background: T.cream, overflow: "hidden",
      display: "flex", flexDirection: "column", position: "relative",
    }} className="noise-overlay">
      <div style={{
        height: 46, background: T.ivory,
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "0 22px", flexShrink: 0, borderBottom: `1px solid ${T.line}`,
      }}>
        <span className="noto" style={{ fontSize: 11, fontWeight: 600, color: T.charcoal }}>9:41</span>
        <div style={{
          width: 88, height: 26, background: "#070302",
          borderRadius: 20, position: "absolute",
          left: "50%", transform: "translateX(-50%)", top: 10,
          boxShadow: "0 0 0 1px #ffffff08",
        }} />
        <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
          {[6,9,12,15].map((h,i) => (
            <div key={i} style={{ width: 3, height: h, background: T.charcoal, borderRadius: 1, opacity: i < 3 ? 1 : 0.3 }} />
          ))}
          <div style={{ width: 20, height: 10, borderRadius: 2, border: `1px solid ${T.charcoal}`, marginLeft: 2, position: "relative" }}>
            <div style={{ position: "absolute", right: -4, top: 2, width: 2, height: 6, background: T.charcoal, borderRadius: "0 1px 1px 0" }} />
            <div style={{ width: "70%", height: "100%", background: T.charcoal, borderRadius: 1 }} />
          </div>
        </div>
      </div>
      <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column" }}>
        {children}
      </div>
    </div>
  </div>
);

const TabBar = ({ active = 0 }) => {
  const tabs = [
    { icon: Icon.home,     label: "ホーム" },
    { icon: Icon.map,      label: "マップ" },
    { icon: Icon.search,   label: "検索"   },
    { icon: Icon.chart,    label: "統計"   },
    { icon: Icon.settings, label: "設定"   },
  ];
  return (
    <div style={{ display: "flex", background: T.white, borderTop: `1px solid ${T.line}`, padding: "8px 0 14px", flexShrink: 0 }}>
      {tabs.map((t, i) => (
        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3, color: i === active ? T.terra : T.grayLight }}>
          {t.icon}
          <span className="noto" style={{ fontSize: 8, fontWeight: i === active ? 600 : 400, letterSpacing: "0.03em" }}>{t.label}</span>
          {i === active && <div style={{ width: 16, height: 2, borderRadius: 1, background: T.terra, marginTop: -1 }} />}
        </div>
      ))}
    </div>
  );
};

const HomeScreen = () => {
  const restaurants = [
    { name: "鮨 はせ川",        genre: "寿司",      date: "2026.05.20", rating: 5, visits: 3, tags: ["記念日", "おまかせ"] },
    { name: "Osteria Toscana", genre: "イタリアン", date: "2026.05.14", rating: 4, visits: 2, tags: ["ランチ"]            },
    { name: "麺屋 颯",          genre: "ラーメン",  date: "2026.05.08", rating: 4, visits: 5, tags: ["一人飯"]            },
    { name: "茶寮 結",          genre: "甘味処",    date: "2026.04.30", rating: 5, visits: 1, tags: ["カフェ"]            },
  ];
  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1 }}>
      <div style={{ padding: "14px 18px 10px", background: T.ivory }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div className="cg" style={{ fontSize: 24, color: T.brown, fontWeight: 300, letterSpacing: "0.06em", lineHeight: 1 }}>ゴチログ</div>
            <div className="noto" style={{ fontSize: 9, color: T.gray, marginTop: 3, letterSpacing: "0.12em" }}>あなただけの食事日記</div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <div style={{ display: "flex", background: T.ivoryDark, borderRadius: 8, padding: 2, gap: 1, border: `1px solid ${T.line}` }}>
              {[Icon.list, Icon.map].map((ic, i) => (
                <div key={i} style={{ width: 26, height: 26, borderRadius: 6, background: i === 0 ? T.terra : "transparent", display: "flex", alignItems: "center", justifyContent: "center", color: i === 0 ? T.white : T.gray }}>{ic}</div>
              ))}
            </div>
            <Avatar size={30} letter="Y" />
          </div>
        </div>
        <div style={{ display: "flex", marginTop: 12, background: T.white, borderRadius: 12, border: `1px solid ${T.line}`, overflow: "hidden" }}>
          {[["11","記録数"],["8","訪問店舗"],["4.2","平均評価"]].map(([v,l],i) => (
            <div key={l} style={{ flex: 1, padding: "10px 6px", textAlign: "center", borderRight: i < 2 ? `1px solid ${T.line}` : "none" }}>
              <div className="cg" style={{ fontSize: 20, color: T.terra, fontWeight: 500, lineHeight: 1 }}>{v}</div>
              <div className="noto" style={{ fontSize: 8, color: T.gray, marginTop: 3, letterSpacing: "0.04em" }}>{l}</div>
            </div>
          ))}
        </div>
      </div>
      <Divider />
      <div style={{ padding: "10px 18px 6px", display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
        <span className="noto" style={{ fontSize: 10, fontWeight: 600, color: T.brownMid, letterSpacing: "0.08em" }}>最近の訪問</span>
        <span className="noto" style={{ fontSize: 9, color: T.terra }}>すべて見る</span>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "0 14px 14px", display: "flex", flexDirection: "column", gap: 8 }}>
        {restaurants.map((r, i) => (
          <div key={i} className={`s${i} pressable`} style={{ background: T.white, borderRadius: 14, border: `1px solid ${T.line}`, padding: "11px 12px", display: "flex", gap: 10, boxShadow: `0 1px 4px ${T.brown}06, 0 4px 12px ${T.brown}04` }}>
            <PhotoPlaceholder w={54} h={54} idx={i} br={10} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <span className="cg" style={{ fontSize: 14, color: T.charcoal, fontWeight: 500, letterSpacing: "0.02em" }}>{r.name}</span>
                <span className="noto" style={{ fontSize: 8, fontWeight: 600, letterSpacing: "0.04em", color: T.brownLight, background: T.terraPale, padding: "2px 6px", borderRadius: 20, border: `1px solid ${T.terra}20`, flexShrink: 0, marginLeft: 4 }}>{r.visits}回</span>
              </div>
              <div className="noto" style={{ fontSize: 9, color: T.gray, marginTop: 2 }}>
                <span style={{ color: T.brownLight }}>{r.genre}</span>
                <span style={{ margin: "0 4px", color: T.line }}>·</span>
                {r.date}
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 7 }}>
                <Stars n={r.rating} size={11} />
                <div style={{ display: "flex", gap: 3, flexWrap: "nowrap", overflow: "hidden", maxWidth: "55%" }}>
                  {r.tags.map(t => <Chip key={t} label={t} />)}
                </div>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div style={{ position: "relative", height: 0 }}>
        <div className="pressable" style={{ position: "absolute", bottom: 8, right: 14, width: 46, height: 46, borderRadius: "50%", background: `linear-gradient(135deg, ${T.terraLight} 0%, ${T.terra} 60%, ${T.terraDark} 100%)`, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: `0 4px 16px ${T.terra}50, 0 1px 0 #ffffff20 inset`, color: T.white }}>{Icon.plus}</div>
      </div>
      <TabBar active={0} />
    </div>
  );
};

const DetailScreen = () => {
